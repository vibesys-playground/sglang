version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = [
  "uv", "run", "--no-project",
  "--with-requirements", ".vibesys/tasks/qwen3.5-397b-a17b-4xb200-sglang/requirements.txt",
  "python", ".vibesys/tasks/qwen3.5-397b-a17b-4xb200-sglang/accuracy_checker/checker.py",
]
timeout_seconds = 600

[benchmark]
command = [
  "uv", "run", "--no-project",
  "--with-requirements", ".vibesys/tasks/qwen3.5-397b-a17b-4xb200-sglang/requirements.txt",
  "python", ".vibesys/tasks/qwen3.5-397b-a17b-4xb200-sglang/benchmark/benchmark.py",
]
timeout_seconds = 1200

[benchmark.result]
json_argument = "--output-json"
metric = "aggregate_throughput"
